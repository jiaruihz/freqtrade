[project]
name = "pm_research"
version = "0.1.0"
description = "Polymarket research-only pre-screening pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "httpx>=0.27.0",
  "tenacity>=8.2.3",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "typer>=0.12.0",
  "pandas>=2.2.0",
  "rich>=13.7.0",
  "python-dotenv>=1.0.1",
]

[project.scripts]
pmr = "pm_research.cli:app"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
